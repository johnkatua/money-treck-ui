name: Deploy MoneyTreck to s3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Install dependencies and build the app
      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
