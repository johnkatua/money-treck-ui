AWSTemplateFormatVersion: "2010-09-09"
Description: "Money Treck UI"

Resources:
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "money-treck-${AWS::Region}-${AWS::AccountId}"
      AccessControl: PublicRead
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${S3Bucket.Arn}/*"

  IAMUser:
    Type: AWS::IAM::User
    Properties:
      UserName: MoneyTreckDeployUser
      Policies:
        - PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !GetAtt S3Bucket.Arn
                  - !Sub "${S3Bucket.Arn}/*"
          PolicyName: MoneyTreckS3Access

  IAMAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref IAMUser

Outputs:
  BucketName:
    Description: Name of the S3Bucket
    Value: !Ref S3Bucket

  WebsiteURL:
    Description: URL of the S3 static website
    Value: !Sub "http://${S3Bucket}.s3-website-${AWS::Region}.amazonaws.com"

  AccessKeyId:
    Description: Access key ID for IAM user
    Value: !Ref IAMAccessKey

  SecretAccessKey:
    Description: Secret access key for IAM user
    Value: !GetAtt IAMAccessKey.SecretAccessKey

  AWSRegion:
    Description: AWS region for the Bucket
    Value: !Ref "AWS::Region"
